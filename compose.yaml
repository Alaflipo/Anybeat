services:
  backend:
    build: ./backend
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ANYBEAT_DB_PATH: /data/songs.sqlite3
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b}
    volumes:
      - ./backend:/app
      - song-data:/data

  frontend:
    build: ./frontend
    environment:
      ANYBEAT_API_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src

volumes:
  song-data:
